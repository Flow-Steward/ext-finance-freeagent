{
  "schema_version": "extension_descriptor_v1",
  "extension_id": "flowsteward.freeagent",
  "release_version": "0.1.0",
  "extension_type": "service_extension",
  "artifacts": {
    "skills": [
      {
        "skill_id": "freeagent_accounting_workflows",
        "ref": "artifacts/skills/freeagent_accounting_workflows.yaml",
        "publish": true
      }
    ]
  },
  "identity": {
    "display_name": "FreeAgent",
    "description": "FreeAgent accounting for UK small businesses: contacts, invoices, estimates, credit notes, bills, expenses, bank accounts, statements and explanations, journals, projects and time, profit and loss, balance sheet, trial balance, VAT, corporation tax and payroll records.",
    "tags": [
      "freeagent",
      "accounting"
    ]
  },
  "vendor": {
    "vendor_name": "Flow Steward"
  },
  "listing": {
    "visibility": "public_reference",
    "category": "finance"
  },
  "distribution": {
    "channel": "private_byo",
    "execution_modes": [
      "local"
    ],
    "allows_self_hosted": true,
    "requires_connected_control_plane": false,
    "import_sources": [
      "file"
    ]
  },
  "runtime": {
    "contract_version": "extension_host_v2",
    "extension_contract_v2": {
      "oauth_providers": [
        {
          "provider_id": "freeagent_oauth",
          "display_name": "FreeAgent",
          "description": "Authorize one FreeAgent production company with your own FreeAgent API app.",
          "setup_page_id": "setup-guide",
          "help_page_id": "setup-guide",
          "flow": {
            "type": "authorization_code",
            "pkce": "none"
          },
          "credential_fields": [
            {
              "field_id": "client_id",
              "value_type": "text",
              "required": true,
              "secret": false,
              "change_policy": "reauthorization_required",
              "label": "OAuth identifier",
              "help_text": "OAuth identifier of your app at dev.freeagent.com (My Apps).",
              "validation": {
                "min_length": 1,
                "max_length": 512
              }
            },
            {
              "field_id": "client_secret",
              "value_type": "secret",
              "required": true,
              "secret": true,
              "change_policy": "reauthorization_required",
              "label": "OAuth secret",
              "help_text": "OAuth secret of the same app; stored and used only by the platform.",
              "validation": {
                "min_length": 1,
                "max_length": 4096
              }
            }
          ],
          "authorization_endpoint": {
            "url": "https://api.freeagent.com/v2/approve_app"
          },
          "token_endpoint": {
            "url": "https://api.freeagent.com/v2/token_endpoint",
            "client_auth_method": "client_secret_basic"
          },
          "callback_id": "oauth_authorization",
          "authorization_intents": [
            {
              "intent_id": "company_connect",
              "static_parameters": {}
            }
          ],
          "post_connect_action_id": "verify_company"
        },
        {
          "provider_id": "freeagent_sandbox_oauth",
          "display_name": "FreeAgent sandbox",
          "description": "Authorize one FreeAgent sandbox company with your own FreeAgent API app.",
          "setup_page_id": "setup-guide",
          "help_page_id": "setup-guide",
          "flow": {
            "type": "authorization_code",
            "pkce": "none"
          },
          "credential_fields": [
            {
              "field_id": "client_id",
              "value_type": "text",
              "required": true,
              "secret": false,
              "change_policy": "reauthorization_required",
              "label": "OAuth identifier",
              "help_text": "OAuth identifier of your app at dev.freeagent.com (My Apps).",
              "validation": {
                "min_length": 1,
                "max_length": 512
              }
            },
            {
              "field_id": "client_secret",
              "value_type": "secret",
              "required": true,
              "secret": true,
              "change_policy": "reauthorization_required",
              "label": "OAuth secret",
              "help_text": "OAuth secret of the same app; stored and used only by the platform.",
              "validation": {
                "min_length": 1,
                "max_length": 4096
              }
            }
          ],
          "authorization_endpoint": {
            "url": "https://api.sandbox.freeagent.com/v2/approve_app"
          },
          "token_endpoint": {
            "url": "https://api.sandbox.freeagent.com/v2/token_endpoint",
            "client_auth_method": "client_secret_basic"
          },
          "callback_id": "oauth_authorization",
          "authorization_intents": [
            {
              "intent_id": "company_connect",
              "static_parameters": {}
            }
          ],
          "post_connect_action_id": "verify_company"
        }
      ],
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml"
    }
  },
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  }
}
