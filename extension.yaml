{
  "manifest_version": 2,
  "extension_id": "flowsteward.freeagent",
  "kind": "tool_provider",
  "version": "0.1.0",
  "display_name": "FreeAgent",
  "description": "FreeAgent accounting for UK small businesses: contacts, invoices, estimates, credit notes, bills, expenses, bank accounts, statements and explanations, journals, projects and time, profit and loss, balance sheet, trial balance, VAT, corporation tax and payroll records.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward",
    "support_url": "https://github.com/Flow-Steward/ext-finance-freeagent/issues",
    "website_url": "https://github.com/Flow-Steward/ext-finance-freeagent"
  },
  "listing": {
    "category": "finance",
    "tags": [
      "freeagent",
      "accounting",
      "bookkeeping",
      "invoices",
      "vat",
      "uk"
    ],
    "summary": "Early release. Live FreeAgent testing is pending. Connect invoices, bills, bank transactions, expenses and reports to your workflows."
  },
  "features": [
    "tool",
    "action"
  ],
  "required_scopes": [
    "extension:invoke",
    "artifact:read",
    "artifact:write"
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_freeagent",
    "required_scopes": [
      "extension:invoke",
      "artifact:read",
      "artifact:write"
    ]
  },
  "egress": {
    "hosts": [
      "api.freeagent.com",
      "api.sandbox.freeagent.com"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Each connection grants access to one FreeAgent company in one project."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 90
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "extension_contract_v2": {
      "oauth_providers": [
        {
          "provider_id": "freeagent_oauth",
          "display_name": "FreeAgent",
          "description": "Authorize one FreeAgent production company with your own FreeAgent API app.",
          "setup_page_id": "setup-guide",
          "help_page_id": "setup-guide",
          "flow": {
            "type": "authorization_code",
            "pkce": "none"
          },
          "credential_fields": [
            {
              "field_id": "client_id",
              "value_type": "text",
              "required": true,
              "secret": false,
              "change_policy": "reauthorization_required",
              "label": "OAuth identifier",
              "help_text": "OAuth identifier of your app at dev.freeagent.com (My Apps).",
              "validation": {
                "min_length": 1,
                "max_length": 512
              }
            },
            {
              "field_id": "client_secret",
              "value_type": "secret",
              "required": true,
              "secret": true,
              "change_policy": "reauthorization_required",
              "label": "OAuth secret",
              "help_text": "OAuth secret of the same app; stored and used only by the platform.",
              "validation": {
                "min_length": 1,
                "max_length": 4096
              }
            }
          ],
          "authorization_endpoint": {
            "url": "https://api.freeagent.com/v2/approve_app"
          },
          "token_endpoint": {
            "url": "https://api.freeagent.com/v2/token_endpoint",
            "client_auth_method": "client_secret_basic"
          },
          "callback_id": "oauth_authorization",
          "authorization_intents": [
            {
              "intent_id": "company_connect",
              "static_parameters": {}
            }
          ],
          "post_connect_action_id": "verify_company"
        },
        {
          "provider_id": "freeagent_sandbox_oauth",
          "display_name": "FreeAgent sandbox",
          "description": "Authorize one FreeAgent sandbox company with your own FreeAgent API app.",
          "setup_page_id": "setup-guide",
          "help_page_id": "setup-guide",
          "flow": {
            "type": "authorization_code",
            "pkce": "none"
          },
          "credential_fields": [
            {
              "field_id": "client_id",
              "value_type": "text",
              "required": true,
              "secret": false,
              "change_policy": "reauthorization_required",
              "label": "OAuth identifier",
              "help_text": "OAuth identifier of your app at dev.freeagent.com (My Apps).",
              "validation": {
                "min_length": 1,
                "max_length": 512
              }
            },
            {
              "field_id": "client_secret",
              "value_type": "secret",
              "required": true,
              "secret": true,
              "change_policy": "reauthorization_required",
              "label": "OAuth secret",
              "help_text": "OAuth secret of the same app; stored and used only by the platform.",
              "validation": {
                "min_length": 1,
                "max_length": 4096
              }
            }
          ],
          "authorization_endpoint": {
            "url": "https://api.sandbox.freeagent.com/v2/approve_app"
          },
          "token_endpoint": {
            "url": "https://api.sandbox.freeagent.com/v2/token_endpoint",
            "client_auth_method": "client_secret_basic"
          },
          "callback_id": "oauth_authorization",
          "authorization_intents": [
            {
              "intent_id": "company_connect",
              "static_parameters": {}
            }
          ],
          "post_connect_action_id": "verify_company"
        }
      ],
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml"
    }
  },
  "callbacks": [
    {
      "callback_id": "oauth_authorization",
      "purpose": "oauth_authorization",
      "methods": [
        "GET"
      ],
      "connection_scoped": false
    }
  ],
